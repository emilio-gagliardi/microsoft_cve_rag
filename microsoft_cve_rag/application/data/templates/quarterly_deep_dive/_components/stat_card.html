{% macro render_stat_card(value, label, change=None, change_positive=True) %}
{# Uses the .stat-card classes defined in report-styles.css #}
<div class="stat-card">
    <span class="stat-card-value">
        {{ value | default('N/A') }}
    </span>
    <span class="stat-card-label">
        {{ label | default('Metric') }}
    </span>
    {% if change is not none %}
        <span class="block text-xs mt-1 {{ 'text-status-success dark:text-status-success-dark' if change_positive else 'text-status-danger dark:text-status-danger-dark' }}">
            <svg xmlns="http://www.w3.org/2000/svg" class="inline-block h-3 w-3 mr-0.5 {{ 'transform rotate-180' if not change_positive else '' }}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
            {{ change }}
        </span>
    {% endif %}
</div>
{% endmacro %}
